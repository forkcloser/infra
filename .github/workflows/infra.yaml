# The plan runs on every pull request and fails on anything the providers
# reject; the apply runs on main, from a plan written in the same job, so
# what applies is what main holds and nothing older. Every token comes from
# a repository secret scoped to one account or one zone.
name: infra

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Two applies racing on the bucket are refused by the state lock; this
# keeps them from being attempted. Runs on main queue rather than cancel.
concurrency:
  group: infra-${{ github.event_name == 'push' && 'apply' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DESEC_API_TOKEN: ${{ secrets.DESEC_API_TOKEN }}
      DESEC_CREATE_TOKEN: ${{ secrets.DESEC_CREATE_TOKEN }}
      GANDI_PERSONAL_ACCESS_TOKEN: ${{ secrets.GANDI_PERSONAL_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - name: Plan
        shell: bash
        run: just plan

      - name: Apply
        if: github.event_name == 'push'
        shell: bash
        run: just apply
