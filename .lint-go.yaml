# This project's carve-outs from the Go lint baseline (.limen/lint-go.yaml):
# the baseline's sections, in its shape, holding only what this project adds,
# changes or takes out (book/per-language.md, "one baseline, per-project
# carve-outs"). `just do lint go` renders the two on every run.
golangci:
  linters:
    settings:
      depguard:
        rules:
          main:
            # The three dependencies dnsctl is built on: the house
            # application toolkit, the CLI framework, and the YAML parser
            # for the zones file. Everything else stays the baseline's $gostd.
            allow:
              - github.com/mycophonic/primordium
              - github.com/alecthomas/kong
              - go.yaml.in/yaml/v3

licenses:
  # go-licenses classifies a LICENSE by its text and has no class for a
  # proprietary notice, so it reports this module as unlicensed; the
  # dependency graph is what the lane is for.
  ignore:
    - github.com/forkcloser/infra
